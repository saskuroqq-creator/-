name: Build Pixel Edition Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pixel_edition/**'
      - '.github/workflows/build-pixel-edition.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Pixel Edition source
        shell: bash
        run: |
          unzip -q "Anima_Survivors_Reborn_Godot_v0.8.1_ANDROID_READY (1).zip" -d buildsrc
          python3 pixel_edition/apply_patch.py
          test -f buildsrc/Anima_Survivors_Reborn_v0.8.1_ANDROID_READY/project.godot

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=Anima Pixel Edition,O=Anima Survivors,C=UZ"             -keyalg RSA -keysize 2048 -validity 10000

      - name: Export Android APK
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: buildsrc/Anima_Survivors_Reborn_v0.8.1_ANDROID_READY
          presets_to_export: Android
          export_debug: true
          cache: true

      - name: Package release
        shell: bash
        run: |
          set -e
          mkdir -p release
          APK="$(find buildsrc -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" release/AnimaSurvivorsReborn-PixelEdition-v1.1-debug.apk
          sha256sum release/AnimaSurvivorsReborn-PixelEdition-v1.1-debug.apk > release/AnimaSurvivorsReborn-PixelEdition-v1.1-debug.apk.sha256
          (cd buildsrc/Anima_Survivors_Reborn_v0.8.1_ANDROID_READY && zip -q -r "../../release/AnimaSurvivorsReborn-PixelEdition-v1.1-source.zip" .)

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimaSurvivorsReborn-PixelEdition-v1.1
          path: release/
          if-no-files-found: error
          retention-days: 30
