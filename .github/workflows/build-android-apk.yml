name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find project archive
        shell: bash
        run: |
          set -e
          ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          test -n "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Extract Godot project
        shell: bash
        run: |
          set -e
          mkdir -p project
          unzip -q "$ARCHIVE" -d project
          PROJECT_DIR="$(find project -name project.godot -type f -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          find "$PROJECT_DIR/scripts" -type f -name '*.gd' -exec sed -i 's/:=/=/g' {} +
          printf '\n[preset.0.options]\ncustom_template/debug=""\n' >> "$PROJECT_DIR/export_presets.cfg"
          sed -i '/\[preset.1.options\]/a texture_format/etc2_astc=true\ntexture_format/s3tc_bptc=false' "$PROJECT_DIR/export_presets.cfg"
          printf '\n[debug]\ngdscript/warnings/enable=false\n' >> "$PROJECT_DIR/project.godot"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Anima Survivors,C=UZ" -keyalg RSA -keysize 2048 -validity 10000

      - name: Export Godot project
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ${{ env.PROJECT_DIR }}
          presets_to_export: Android
          export_debug: true
          cache: true

      - name: Locate APK
        shell: bash
        run: |
          set -e
          mkdir -p release
          APK="$(find . -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" release/AnimaSurvivorsReborn-v0.8.1-debug.apk
          sha256sum release/AnimaSurvivorsReborn-v0.8.1-debug.apk > release/AnimaSurvivorsReborn-v0.8.1-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimaSurvivorsReborn-Android-v0.8.1
          path: release/*
          if-no-files-found: error
          retention-days: 30
