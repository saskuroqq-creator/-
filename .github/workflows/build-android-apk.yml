          mkdir -p release
          APK="$(find . -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" release/AnimaSurvivorsReborn-v0.8.1-debug.apk
          sha256sum release/AnimaSurvivorsReborn-v0.8.1-debug.apk > release/AnimaSurvivorsReborn-v0.8.1-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimaSurvivorsReborn-Android-v0.8.1
          path: release/*
          if-no-files-found: error
          retention-days: 30
 % n, data, re.M):
                  data += "\\n[preset.%d.options]\\ncustom_template/debug=""\\ncustom_template/release=""\\n" % n
          open(path, "w", encoding="utf-8").write(data)
          PY

          # Disable the two relevant GDScript warning categories.
          if grep -q '^\[debug\]$' "$PROJECT_DIR/project.godot"; then
            sed -i '/^\[debug\]$/a gdscript/warnings/untyped_declaration=0\ngdscript/warnings/inference_on_variant=0' "$PROJECT_DIR/project.godot"
