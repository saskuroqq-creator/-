name: Build Android APK - Pixel Portrait v1.1

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-android-apk-final.yml'
      - 'pixel_edition/**'
      - '*.zip'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Pixel Portrait v1.1 project
        run: |
          set -euo pipefail
          mkdir -p project
          ARCHIVE="Anima_Survivors_Reborn_Godot_v0.8.1_ANDROID_READY (1).zip"
          test -f "$ARCHIVE"
          unzip -q "$ARCHIVE" -d project
          BASE_DIR="$(find project -name project.godot -type f -print -quit | xargs -r dirname)"
          test -n "$BASE_DIR"

          mkdir -p buildsrc
          cp -a "$BASE_DIR" buildsrc/Anima_Survivors_Reborn_v0.8.1_ANDROID_READY

          python3 pixel_edition/apply_patch.py

          PROJECT_DIR="buildsrc/Anima_Survivors_Reborn_v0.8.1_ANDROID_READY"
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"
          test -f "$PROJECT_DIR/icon.svg"

          find "$PROJECT_DIR/scripts" -type f -name '*.gd' -exec sed -i 's/:=/=/g' {} +
          printf '\n[preset.0.options]\ncustom_template/debug=""\ncustom_template/release=""\n' >> "$PROJECT_DIR/export_presets.cfg"

          if grep -q '^\[rendering\]$' "$PROJECT_DIR/project.godot"; then
            sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' "$PROJECT_DIR/project.godot"
          else
            printf '\n[rendering]\ntextures/vram_compression/import_etc2_astc=true\n' >> "$PROJECT_DIR/project.godot"
          fi

          rm -rf "$PROJECT_DIR/.godot/imported"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Pixel Portrait v1.1 ==="
          grep -E 'config/name=|viewport_width=|viewport_height=|handheld/orientation|enable_frame_pacing|swappy_mode' "$PROJECT_DIR/project.godot" || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Create debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=Android Debug,O=Anima Survivors,C=UZ"             -keyalg RSA -keysize 2048 -validity 10000

      - name: Export Pixel Portrait v1.1 APK
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ${{ env.PROJECT_DIR }}
          presets_to_export: Android
          export_debug: true
          cache: true

      - name: Verify and package APK
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$HOME/.local/share/godot/builds/Android/AnimaSurvivorsReborn.apk"
          test -s "$APK"
          cp "$APK" release/AnimaSurvivorsReborn-PixelPortrait-v1.1-debug.apk
          sha256sum release/AnimaSurvivorsReborn-PixelPortrait-v1.1-debug.apk > release/AnimaSurvivorsReborn-PixelPortrait-v1.1-debug.apk.sha256
          ls -lh release/*
          file release/AnimaSurvivorsReborn-PixelPortrait-v1.1-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnimaSurvivorsReborn-PixelPortrait-v1.1
          path: release/*
          if-no-files-found: error
          retention-days: 30
